<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Multi API TodoList</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        [hidden] {
            display: none !important;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        #mensagem {
            margin: 16px 0;
            color: #b42318;
        }

        .cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        button {
            cursor: pointer;
            padding: 8px 12px;
        }

        .estatisticas {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
        }

        #todoList li {
            gap: 12px;
            align-items: center;
        }

        .titulo-tarefa {
            overflow-wrap: anywhere;
            min-width: 0;
        }

        .actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Multi API TodoList</h1>

        <p id="mensagem" role="status" aria-live="polite"></p>

        <section id="autenticacao">
            <div class="card">
                <h2>Entrar</h2>
                <form id="loginForm">
                    <label for="loginEmail">Email</label>
                    <input id="loginEmail" type="email" autocomplete="username" required>

                    <label for="loginSenha">Senha</label>
                    <input id="loginSenha" type="password" autocomplete="current-password" required>

                    <button type="submit">Entrar</button>
                </form>
            </div>

            <div class="card">
                <h2>Criar conta</h2>
                <form id="cadastroForm">
                    <label for="cadastroNome">Nome</label>
                    <input id="cadastroNome" autocomplete="name" required>

                    <label for="cadastroEmail">Email</label>
                    <input id="cadastroEmail" type="email" autocomplete="email" required>

                    <label for="cadastroSenha">Senha</label>
                    <input id="cadastroSenha" type="password" autocomplete="new-password" minlength="8" required>

                    <button type="submit">Cadastrar</button>
                </form>
            </div>
        </section>

        <section id="painel" hidden>
            <div class="cabecalho">
                <p id="usuarioNome"></p>
                <button id="sair" type="button">Sair</button>
            </div>

            <div class="card">
                <h2>Nova tarefa</h2>
                <form id="todoForm">
                    <label for="title">Título</label>
                    <input id="title" maxlength="255" required>
                    <button type="submit">Adicionar</button>
                </form>
            </div>

            <div class="card">
                <h2>Lista de tarefas</h2>
                <ul id="todoList"></ul>
            </div>

            <div class="card">
                <h2>Estatísticas</h2>
                <div class="estatisticas">
                    <p>Total: <strong id="total">—</strong></p>
                    <p>Concluídas: <strong id="completed">—</strong></p>
                    <p>Pendentes: <strong id="pending">—</strong></p>
                </div>
            </div>
        </section>
    </div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
